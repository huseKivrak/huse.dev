<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>PR WIRE</title>
<style>
  :root {
    --accent: #c8102e;
    --gold: #ffb612;
    --bg: #0a0b0d;
    --panel: #111318;
    --line: #1f232b;
    --dim: #8b919c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding-bottom: 96px;
  }
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 26px 24px 18px;
    border-bottom: 2px solid var(--accent);
  }
  .masthead .brand {
    background: var(--accent);
    padding: 4px 12px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: 0.12em;
    font-size: 1.2rem;
  }
  .masthead .sub {
    color: var(--dim);
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .masthead .updated { margin-left: auto; color: var(--dim); font-size: 0.75rem; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }

  .potd {
    background: linear-gradient(135deg, #16181d 0%, var(--panel) 100%);
    border: 1px solid var(--line);
    border-left: 6px solid var(--gold);
    padding: 22px 24px;
    margin-bottom: 30px;
  }
  .potd .tag {
    color: var(--gold);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .potd h1 { font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 700; margin: 10px 0 8px; line-height: 1.25; }
  .potd .meta { color: var(--dim); font-size: 0.85rem; margin-bottom: 10px; }
  .potd .meta b { color: #fff; font-weight: 600; }
  .potd .reason { font-style: italic; color: #c9ced8; font-size: 0.95rem; line-height: 1.45; }

  .feed-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .feed-head h2 { font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .day {
    margin: 22px 0 8px;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 64px 1fr auto auto;
    gap: 14px;
    align-items: baseline;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
  }
  .row:hover { background: var(--panel); }
  .row .time { color: var(--dim); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
  .row .title { font-size: 0.95rem; font-weight: 500; line-height: 1.35; }
  .row .author { color: var(--dim); font-size: 0.82rem; white-space: nowrap; }
  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .badge.production, .badge.production-eu-env { background: var(--accent); color: #fff; }
  .badge.master { background: #23364d; color: #9cc3f0; }
  .badge.preprod { background: #2c2a1c; color: var(--gold); }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; }
    .row .time, .row .author { display: none; }
  }

  .lower-third {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    display: none;
    align-items: stretch;
    background: linear-gradient(180deg, #16181d 0%, #0b0c0f 100%);
    border-top: 2px solid var(--accent);
  }
  .lower-third.on { display: flex; }
  .lt-badge {
    flex: 0 0 auto;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 18px;
    background: var(--accent);
    z-index: 2;
    box-shadow: 8px 0 16px rgba(0,0,0,0.6);
  }
  .lt-badge .top { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.25em; color: rgba(255,255,255,0.85); }
  .lt-badge .main { font-size: 1rem; font-weight: 800; letter-spacing: 0.12em; font-style: italic; }
  .lt-viewport { flex: 1 1 auto; overflow: hidden; display: flex; align-items: center; }
  .lt-crawl { display: inline-flex; align-items: center; white-space: nowrap; will-change: transform; animation: crawl var(--dur, 60s) linear infinite; }
  @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .lt-item { display: inline-flex; align-items: baseline; padding: 0 1.4em; }
  .lt-item .headline { font-size: 0.92rem; font-weight: 600; }
  .lt-item .quip { font-size: 0.85rem; font-style: italic; color: #9aa0aa; margin-left: 0.8em; }
  .lt-sep { display: inline-block; width: 5px; height: 5px; background: var(--accent); transform: rotate(45deg); margin: 0 0.2em; }
</style>
</head>
<body>
  <div class="masthead">
    <span class="brand">PR WIRE</span>
    <span class="sub">merged pull requests</span>
    <span class="updated" id="updated"></span>
  </div>
  <div class="wrap">
    <section class="potd" id="potd" hidden>
      <div class="tag">&#9733; PR of the Day</div>
      <h1 id="potd-title"></h1>
      <div class="meta" id="potd-meta"></div>
      <div class="reason" id="potd-reason"></div>
    </section>
    <div class="feed-head"><h2>The Wire</h2></div>
    <div id="feed"></div>
  </div>
  <div class="lower-third">
    <div class="lt-badge"><span class="top">PR WIRE</span><span class="main">ALL TIME</span></div>
    <div class="lt-viewport"><div class="lt-crawl" id="crawl"></div></div>
  </div>
<script>
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const fmtDay = d => d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  async function load() {
    let data;
    try {
      const res = await fetch(`/amp/data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return;
      data = await res.json();
    } catch { return; }

    if (data.updated) {
      const d = new Date(data.updated);
      document.getElementById('updated').textContent = 'updated ' + fmtDay(d) + ' ' + fmtTime(d);
    }

    const p = data.prOfTheDay;
    if (p) {
      document.getElementById('potd').hidden = false;
      document.getElementById('potd-title').textContent = p.title;
      document.getElementById('potd-meta').innerHTML =
        `PR ${p.id} &middot; <b>${esc(p.author)}</b> &middot; into ${esc(p.target)} &middot; ${fmtDay(new Date(p.closed))}`;
      document.getElementById('potd-reason').textContent = p.reason || '';
    }

    const feed = document.getElementById('feed');
    let html = '', lastDay = '';
    for (const pr of data.prs || []) {
      const d = new Date(pr.closed);
      const day = fmtDay(d);
      if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
      html += `<div class="row">` +
        `<span class="time">${fmtTime(d)}</span>` +
        `<span class="title">${esc(pr.title)}</span>` +
        `<span class="author">${esc(pr.author)} &middot; ${pr.id}</span>` +
        `<span class="badge ${esc(pr.target)}">${esc(pr.target)}</span>` +
        `</div>`;
    }
    feed.innerHTML = html;
  }

  async function loadCrawl() {
    try {
      const res = await fetch(`/amp/goat.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return;
      const items = await res.json();
      if (!Array.isArray(items) || !items.length) return;
      const crawl = document.getElementById('crawl');
      const one = items.map(it =>
        `<span class="lt-item"><span class="headline">${esc(it.headline || '')}</span>` +
        (it.quip ? `<span class="quip">${esc(it.quip)}</span>` : '') +
        `</span><span class="lt-sep"></span>`).join('');
      crawl.innerHTML = one + one;
      const dur = Math.max(40, crawl.scrollWidth / 2 / 80);
      crawl.style.setProperty('--dur', dur + 's');
      document.querySelector('.lower-third').classList.add('on');
    } catch { /* no crawl */ }
  }

  load();
  loadCrawl();
  setInterval(load, 60000);
</script>
</body>
</html>
